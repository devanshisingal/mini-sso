name: Mini SSO CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint-and-test:
    name: Backend (Python 3.12 + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: minisso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: idp-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt psycopg2-binary

      - name: Ruff Lint Check
        run: ruff check .

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/minisso_test
        run: alembic upgrade head

      - name: Run Pytest with Coverage
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_ENCRYPTION_KEY: ci-test-secret-encryption-key-32b
        run: pytest -v --cov=app --cov-report=term-missing

  frontend-tests:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [idp-ui, demo-app]

    defaults:
      run:
        working-directory: ${{ matrix.app }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "${{ matrix.app }}/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript & Vite Build
        run: npm run build

      - name: Run Vitest Unit Tests
        run: npm test

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-lint-and-test, frontend-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build idp-api Image
        uses: docker/build-push-action@v5
        with:
          context: ./idp-api
          push: false
          tags: mini-sso-api:latest

      - name: Build idp-ui Image
        uses: docker/build-push-action@v5
        with:
          context: ./idp-ui
          push: false
          tags: mini-sso-idp-ui:latest

      - name: Build demo-app Image
        uses: docker/build-push-action@v5
        with:
          context: ./demo-app
          push: false
          tags: mini-sso-demo-app:latest
